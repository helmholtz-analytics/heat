name: On PR Update

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/**'
      - 'heat/**'
      - 'tests/**'

jobs:
  quick-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py-version:
          - '3.11' # Oldest supported
          - '3.14' # Latest stable
        mpi: [ 'mpich' ]
        pytorch-version:
          - 'torch==2.4.1 torchvision==0.19.1 torchaudio==2.4.1'   # Oldest supported
          - 'torch==2.13.0 torchvision==0.28.0' # Latest stable
        exclude:
          - py-version: '3.14'
            pytorch-version: 'torch==2.4.1 torchvision==0.19.1 torchaudio==2.4.1'
    name: Quick Tests - Py${{ matrix.py-version }} with ${{ matrix.pytorch-version }}"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - uses: ./.github/actions/gh_tests
        with:
          mode: medium
          sha: ${{ github.event.pull_request.head.sha }}
          py-version: ${{ matrix.py-version }}
          mpi: ${{ matrix.mpi }}
          pytorch-version: ${{ matrix.pytorch-version }}

  trigger-tests:
    name: Trigger Codebase Tests
    runs-on: ubuntu-latest
    needs: quick-tests
    if: ${{ !startsWith(github.head_ref, 'dependabot') }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/trigger_codebase_tests
        with:
          branch: ${{ github.head_ref }}
          sha: ${{ github.event.pull_request.head.sha }}
          pr_number: ${{ github.event.pull_request.number }}
          trigger_token: ${{ secrets.CX_TRIGGER_TOKEN }}

  trigger-benchmarks:
    name: Trigger Codebase Benchmarks
    runs-on: ubuntu-latest
    needs: trigger-tests
    if: ${{ !startsWith(github.head_ref, 'dependabot') && contains(github.event.pull_request.labels.*.name, 'benchmark PR') }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/trigger_codebase_benchmarks
        with:
          branch: ${{ github.head_ref }}
          sha: ${{ github.event.pull_request.head.sha }}
          author: ${{ github.event.pull_request.assignee.login || 'heat_team' }}
          pr_number: ${{ github.event.pull_request.number }}
          trigger_token: ${{ secrets.CX_TRIGGER_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  check_reuse_compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Check REUSE compliance
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: x64

      - name: Install REUSE
        run: |
          pip install reuse

      - name: Run linter
        run: |
          reuse lint
