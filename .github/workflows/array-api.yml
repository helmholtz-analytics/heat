name: Test Array API

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        mpi: [ 'mpich' ]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: heat
    - name: Setup MPI
      uses: mpi4py/setup-mpi@3417e34f1394a16723d7913c236642c24e95fd5a # v1.4.4
      with:
        mpi: ${{ matrix.mpi }}
    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install ${GITHUB_WORKSPACE}/heat/
    - name: Checkout array-api-tests
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: data-apis/array-api-tests
        path: array-api-tests
        submodules: 'true'
    - name: Install dependencies
      run: |
        python -m pip install -r ${GITHUB_WORKSPACE}/array-api-tests/requirements.txt
    - name: Run the test suite
      env:
        ARRAY_API_TESTS_MODULE: heat
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE}/heat"
        # Skip testing functions with known issues
        cd ${GITHUB_WORKSPACE}/array-api-tests
        pytest array_api_tests/ -v -rxXfE --ci --xfails-file ${GITHUB_WORKSPACE}/.github/array_api_test/xfails.txt --skips-file ${GITHUB_WORKSPACE}/.github/array_api_test/test/skips.txt --disable-extension linalg --disable-extension fft
