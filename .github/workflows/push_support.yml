name: On Push Support
on:
  push:
    branches:
      - 'support/**'
jobs:
  test-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.MATRIX_MAX_PARALLEL) }}
      matrix:
        py-version:
          - '3.12' # Oldest supported
          - '3.14' # Latest stable
        mpi: [ 'mpich' ]
        pytorch-version:
          - 'torch torchvision' # Latest
    name: Python ${{ matrix.py-version }} with ${{ matrix.pytorch-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/gh_tests
        with:
          mode: "full"
          py-version: ${{ matrix.py-version }}
          mpi: ${{ matrix.mpi }}
          pytorch-version: ${{ matrix.pytorch-version }}
