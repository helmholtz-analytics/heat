version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "mpi4py/setup-MPI"

  - package-ecosystem: pip
    directory: /doc
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
