ignore:
  - "heat/utils/data/mnist.py"
  - "heat/utils/data/_utils.py"

coverage:
  status:
    project:
      default:
        # basic
        target: auto
        threshold: 3%
        flags:
          - unit

    patch:
      default:
        # basic
        target: auto
        threshold: 3%
        flags:
          - "unit"

flags:
  unit:
    carryforward: true
    paths:
      - "heat"
